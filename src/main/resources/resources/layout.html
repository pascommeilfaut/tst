<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Libra Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background-color: #f8f9fa; border-right: 1px solid #dee2e6; }
        .nav-link { color: #333; }
        .nav-link.active { background-color: #e9ecef; }
    </style>
</head>
<body>
<div class="d-flex">
    <div class="d-flex flex-column p-3 sidebar" style="width: 280px;">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none">
            <span class="fs-4">Libra</span>
        </a>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="/" class="nav-link" th:classappend="${#httpServletRequest.requestURI == '/' ? 'active' : ''}">
                    Dashboard
                </a>
            </li>
            <li>
                <span class="nav-link disabled text-uppercase fw-bold mt-2">POS</span>
            </li>
            <li>
                <a href="#" class="nav-link">Browse POS</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a href="#" class="nav-link">Add POS</a>
            </li>

            <li>
                <span class="nav-link disabled text-uppercase fw-bold mt-2">Issues</span>
            </li>
            <li>
                <a href="/issues/add" class="nav-link" th:classappend="${#httpServletRequest.requestURI == '/issues/add' ? 'active' : ''}">Add Issue</a>
            </li>
            <li>
                <a href="/issues/browse" class="nav-link" th:classappend="${#httpServletRequest.requestURI == '/issues/browse' ? 'active' : ''}">Browse Issues</a>
            </li>

            <li sec:authorize="hasRole('ADMIN')">
                <span class="nav-link disabled text-uppercase fw-bold mt-2">Users</span>
                <ul class="list-unstyled ps-3">
                    <li><a href="#" class="nav-link">Browse Users</a></li>
                    <li><a href="#" class="nav-link">Add User</a></li>
                </ul>
            </li>
        </ul>
        <hr>
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                <strong sec:authentication="name">User</strong>
            </a>
            <ul class="dropdown-menu text-small shadow" aria-labelledby="dropdownUser1">
                <li><a class="dropdown-item" href="/logout">Sign out</a></li>
            </ul>
        </div>
    </div>

    <div class="flex-grow-1 p-4">
        <div th:replace="${content}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
