<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::div})}">
<body>
<div class="container-fluid" style="max-width: 900px;">
    <h1 class="mb-4" th:text="${showSearch} ? 'New issue' : (${issueId} == null ? 'New issue' : 'Issue details')">New issue</h1>

    <div th:if="${showSearch}">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3 text-muted">Search POS</h5>
                <form th:action="@{/issues/add}" method="get" class="d-flex gap-2">
                    <input type="text" name="searchTerm" class="form-control"
                           placeholder="Search by ID, Name, Phone..." th:value="${searchTerm}">
                    <button class="btn btn-primary" type="submit">Search</button>
                    <a th:if="${not #strings.isEmpty(searchTerm)}" th:href="@{/issues/add}" class="btn btn-outline-secondary">Clear</a>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th th:replace="~{fragments/tables :: sortHeader('id', 'POS #', ${posList}, '/issues/add')}"></th>
                            <th th:replace="~{fragments/tables :: sortHeader('name', 'POS name', ${posList}, '/issues/add')}"></th>
                            <th th:replace="~{fragments/tables :: sortHeader('telephone', 'Telephone', ${posList}, '/issues/add')}"></th>
                            <th th:replace="~{fragments/tables :: sortHeader('cellphone', 'Cellphone', ${posList}, '/issues/add')}"></th>
                            <th th:replace="~{fragments/tables :: sortHeader('address', 'Address', ${posList}, '/issues/add')}"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="pos : ${posList.content}"
                            th:data-url="@{/issues/add(selectedPosId=${pos.id})}"
                            ondblclick="window.location.href=this.getAttribute('data-url')"
                            style="cursor: pointer;"
                            title="Double click to select">
                            <td th:text="${pos.id}"></td>
                            <td th:text="${pos.name}"></td>
                            <td th:text="${pos.telephone}"></td>
                            <td th:text="${pos.cellphone}"></td>
                            <td th:text="${pos.address}"></td>
                        </tr>
                        <tr th:if="${posList.empty}">
                            <td colspan="5" class="text-center py-4 text-muted">No POS found.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-white border-top-0">
                <div th:replace="~{fragments/tables :: pagination(${posList}, '/issues/add')}"></div>
            </div>
        </div>
    </div>

    <div th:unless="${showSearch}">

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3 text-muted" th:text="${issueId} == null ? 'Target POS' : 'Issue Object'">Target POS</h5>
                <div class="table-responsive">
                    <table class="table table-bordered mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>POS Id</th>
                            <th>POS Name</th>
                            <th>Telephone</th>
                            <th>Cellphone</th>
                            <th>Address</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${selectedPos != null}">
                            <td th:text="${selectedPos.id}"></td>
                            <td th:text="${selectedPos.name}"></td>
                            <td th:text="${selectedPos.telephone}"></td>
                            <td th:text="${selectedPos.cellphone}"></td>
                            <td th:text="${selectedPos.address}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="@{${formAction}}" th:object="${issue}" method="post">
                    <input type="hidden" th:field="*{posId}">

                    <h5 class="mb-3 text-muted">Issue Information</h5>

                    <div class="row mb-3">
                        <div class="col-md-2 mb-3">
                            <label for="issueTypeId" class="form-label">Issue type <span class="text-danger">*</span></label>
                            <select class="form-select" id="issueTypeId" th:field="*{issueTypeId}" required>
                                <option th:each="type : ${issueTypes}" th:value="${type.id}" th:text="${type.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="subTypeId" class="form-label">Subclass <span class="text-danger">*</span></label>
                            <select class="form-select" id="subTypeId" th:field="*{subTypeId}" required>
                                <option value=""></option>
                                <option th:each="sub : ${subTypes}" th:value="${sub.id}" th:text="${sub.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="problem" class="form-label">Problem <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="problem" th:field="*{problem}" required>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label for="priority" class="form-label">Priority <span class="text-danger">*</span></label>
                            <select class="form-select" id="priority" th:field="*{priority}" required>
                                <option th:each="p : ${priorities}" th:value="${p}" th:text="${p.displayName}"></option>
                            </select>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
                            <select class="form-select" id="status" th:field="*{status}" required>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}"></option>
                            </select>
                        </div>
                    </div>

                    <h5 class="mb-3 text-muted">Details & Resolution</h5>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="problemDescription" class="form-label">Problem description <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="problemDescription" th:field="*{problemDescription}" rows="5" required></textarea>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="solution" class="form-label">Solution</label>
                            <textarea class="form-control" id="solution" th:field="*{solution}" rows="5"></textarea>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="assignedTo" class="form-label">Assigned To <span class="text-danger">*</span></label>
                                <select class="form-select" id="assignedTo" th:field="*{assignedTo}" required>
                                    <option th:each="u : ${userTypes}" th:value="${u.id}" th:text="${u.displayName}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="memo" class="form-label">Memo</label>
                                <input type="text" class="form-control" id="memo" th:field="*{memo}">
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="/issues/browse" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary" th:text="${issueId} == null ? 'Create Issue' : 'Update Issue'">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
