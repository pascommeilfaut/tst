<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::div})}">
<body>
<div>
    <h2>Issues Manager</h2>

    <table class="table table-hover mt-3">
        <thead>
        <tr>
            <th th:fragment="sortHeader(field, label)" scope="col">
                <a th:href="@{/issues/browse(status=${param.status}, page=${issues.number}, size=${issues.size}, sort=${field} + ',' + (${issues.sort.getOrderFor(field)?.direction?.name() == 'ASC' ? 'desc' : 'asc'}))}"
                   class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                    <span th:text="${label}">Label</span>
                    <span th:if="${issues.sort.getOrderFor(field)?.direction?.name() == 'ASC'}">▴</span>
                    <span th:if="${issues.sort.getOrderFor(field)?.direction?.name() == 'DESC'}">▾</span>
                    <span th:if="${issues.sort.getOrderFor(field) == null}" class="text-muted" style="font-size: 0.8em; opacity: 0.5;">⇅</span>
                </a>
            </th>

            <th th:replace="::sortHeader('id', 'Issue #')"></th>
            <th th:replace="::sortHeader('pos.name', 'Pos Name')"></th>
            <th th:replace="::sortHeader('createdBy.name', 'Created By')"></th>
            <th th:replace="::sortHeader('createdAt', 'Date')"></th>
            <th th:replace="::sortHeader('type.name', 'Type')"></th>
            <th th:replace="::sortHeader('status', 'Status')"></th>
            <th th:replace="::sortHeader('assignedTo', 'Assigned To')"></th>
            <th th:replace="::sortHeader('memo', 'Memo')"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="issue : ${issues.content}">
            <td th:text="${issue.id}"></td>
            <td th:text="${issue.pos.name}"></td>
            <td th:text="${issue.createdBy.name}"></td>
            <td th:text="${#temporals.format(issue.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${issue.type.name}"></td>
            <td th:text="${issue.status.value.displayName}"></td>
            <td th:text="${issue.assignedTo != null ? issue.assignedTo.value.displayName : '-'}"></td>
            <td th:text="${issue.memo}"></td>
        </tr>
        </tbody>
    </table>

    <nav aria-label="Page navigation" th:if="${issues.totalPages > 0}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${issues.first} ? 'disabled'">
                <a class="page-link" th:href="@{/issues/browse(status=${param.status}, page=${issues.number - 1}, sort=${param.sort})}">Previous</a>
            </li>
            <li class="page-item" th:classappend="${issues.last} ? 'disabled'">
                <a class="page-link" th:href="@{/issues/browse(status=${param.status}, page=${issues.number + 1}, sort=${param.sort})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
