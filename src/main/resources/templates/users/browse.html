<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::div})}">
<body>
<div class="w-100">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">Users Manager</h2>
    </div>

    <div th:replace="~{fragments/tables :: searchForm('/users/browse')}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th th:replace="~{fragments/tables :: sortHeader('name', 'Name', ${users}, '/users/browse')}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('email', 'Email', ${users}, '/users/browse')}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('login', 'Login', ${users}, '/users/browse')}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('telephone', 'Telephone', ${users}, '/users/browse')}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('type.value', 'User Type', ${users}, '/users/browse')}"></th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users.content}">
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.login}"></td>
                    <td th:text="${user.telephone}"></td>
                    <td>
                        <span class="badge bg-secondary" th:text="${user.type.value.displayName}"></span>
                    </td>
                    <td>
                        <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                    </td>
                </tr>
                <tr th:if="${users.empty}">
                    <td colspan="6" class="text-center py-4 text-muted">No users found.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/tables :: pagination(${users}, '/users/browse')}"></div>
    </div>
</div>
</body>
</html>
