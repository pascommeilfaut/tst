<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Libra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-image: url("images/xp.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background-color: white;
            border-radius: 4px;
        }
        .input-group-text {
            width: 45px;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="card shadow login-card border-0">
    <div class="card-body p-4">
        <h5 class="card-title mb-4 text-uppercase text-secondary" style="font-size: 0.9rem; letter-spacing: 0.5px;">Welcome to Libra</h5>

        <form th:action="@{/login}" method="post">
            <div th:if="${param.error}" class="alert alert-danger py-2 text-center small" role="alert">
                Invalid username or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-info py-2 text-center small" role="alert">
                You have been logged out.
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text bg-primary text-white border-primary">
                    <i class="bi bi-person-fill"></i>
                </span>
                <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="Username" required autofocus>
            </div>

            <div class="input-group mb-4">
                <span class="input-group-text bg-primary text-white border-primary">
                    <i class="bi bi-lock-fill"></i>
                </span>
                <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Password" required>
            </div>

            <button class="w-100 btn btn-primary" type="submit">Sign In</button>
        </form>
    </div>
</div>

</body>
</html>
