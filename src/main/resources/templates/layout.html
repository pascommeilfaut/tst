<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} ?: 'Libra'">Libra</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">

    <style>
        .sidebar { min-height: 100vh; background-color: #f8f9fa; }
        .nav-link { color: #333; margin-bottom: 5px; }
        .nav-link:hover { background-color: #e9ecef; }
        .nav-link.active { background-color: #e9ecef; font-weight: bold; }
        .sidebar-header { padding: 20px; font-weight: bold; font-size: 1.5rem; }
    </style>
</head>
<body>
<div class="d-flex">
    <div class="sidebar p-3 border-end" style="width: 250px;">
        <div class="sidebar-header text-primary"><i class="bi bi-ui-checks-grid"></i> Libra</div>
        <hr>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a th:href="@{/}" class="nav-link"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/issues}" class="nav-link"><i class="bi bi-tools me-2"></i> Issues</a>
            </li>
            <li class="nav-item" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                <a th:href="@{/pos/browse}" class="nav-link"><i class="bi bi-credit-card me-2"></i> POS Manager</a>
            </li>
            <li class="nav-item" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                <a th:href="@{/users/browse}" class="nav-link"><i class="bi bi-people me-2"></i> Users</a>
            </li>
        </ul>
    </div>

    <div class="flex-grow-1 d-flex flex-column">
        <nav class="navbar navbar-light bg-white border-bottom px-4 py-3">
            <span class="navbar-brand mb-0 h4" th:text="${pageTitle} ?: 'Dashboard'">Page Title</span>
            <div class="d-flex align-items-center">
                <span class="me-3 text-muted" th:text="${#authentication.name}">User</span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-outline-danger btn-sm" type="submit">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </form>
            </div>
        </nav>

        <div class="container-fluid p-4 bg-light flex-grow-1">
            <div th:replace="${content}"></div>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
