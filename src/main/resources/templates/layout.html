<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Libra Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        html, body { height: 100%; overflow: hidden; }

        .sidebar {
            width: 280px;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        .main-content {
            flex-grow: 1;
            height: 100vh;
            overflow-y: auto;
            background-color: #ffffff;
        }

        .nav-link { color: #333; }
        .nav-link.active { background-color: #0d6efd; color: white !important; }
        .nav-link:hover:not(.active) { background-color: #e9ecef; }

        .sidebar-toggle {
            color: #6c757d;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 0.5rem 1rem;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-toggle:hover {
            color: #333;
            background-color: rgba(0,0,0,0.05);
        }

        .sidebar-toggle .bi-chevron-down {
            transition: transform 0.2s ease;
        }
        .sidebar-toggle[aria-expanded="false"] .bi-chevron-down {
            transform: rotate(-90deg);
        }

        .submenu .nav-link {
            padding-left: 2rem;
            font-size: 0.95rem;
        }
    </style>
    <link th:href="@{/styles/main.css}" rel="stylesheet"/>
    <link th:href="@{/styles/dashboard.css}" rel="stylesheet"/>
</head>
<body>
<div class="d-flex h-100">
    <div class="sidebar p-3">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none">
            <span class="fs-4 text-dark fw-bold">Libra</span>
        </a>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item mb-1">
                <a href="/" class="nav-link"
                   th:classappend="${currentURI == '/' ? 'active' : ''}">
                    <i class="bi bi-speedometer2 me-2"></i> Dashboard
                </a>
            </li>

            <li class="nav-item mb-1">
                <button class="sidebar-toggle rounded" data-bs-toggle="collapse" data-bs-target="#pos-collapse"
                        th:aria-expanded="${currentURI != null && currentURI.startsWith('/pos')}" aria-controls="pos-collapse">
                    <span>POS</span>
                    <i class="bi bi-chevron-down"></i>
                </button>
                <div class="collapse" id="pos-collapse"
                     th:classappend="${currentURI != null && currentURI.startsWith('/pos') ? 'show' : ''}">
                    <ul class="nav nav-pills flex-column submenu">
                        <li>
                            <a href="/pos/browse" class="nav-link"
                               th:classappend="${currentURI != null && currentURI.startsWith('/pos/browse') ? 'active' : ''}">
                                Browse POS
                            </a>
                        </li>
                        <li sec:authorize="hasRole('ADMIN')">
                            <a href="/pos/add" class="nav-link"
                               th:classappend="${currentURI != null && currentURI.startsWith('/pos/add') ? 'active' : ''}">
                                Add POS
                            </a>
                        </li>
                    </ul>
                </div>
            </li>

            <li class="nav-item mb-1">
                <button class="sidebar-toggle rounded" data-bs-toggle="collapse" data-bs-target="#issues-collapse"
                        th:aria-expanded="${currentURI != null && currentURI.startsWith('/issues')}" aria-controls="issues-collapse">
                    <span>Issues</span>
                    <i class="bi bi-chevron-down"></i>
                </button>
                <div class="collapse" id="issues-collapse"
                     th:classappend="${currentURI != null && currentURI.startsWith('/issues') ? 'show' : ''}">
                    <ul class="nav nav-pills flex-column submenu">
                        <li>
                            <a href="/issues/browse" class="nav-link"
                               th:classappend="${currentURI != null && currentURI.startsWith('/issues/browse') ? 'active' : ''}">
                                Browse Issues
                            </a>
                        </li>
                        <li>
                            <a href="/issues/add" class="nav-link"
                               th:classappend="${currentURI != null && currentURI.startsWith('/issues/add') ? 'active' : ''}">
                                Add Issue
                            </a>
                        </li>
                    </ul>
                </div>
            </li>

            <li class="nav-item mb-1" sec:authorize="hasRole('ADMIN')">
                <button class="sidebar-toggle rounded" data-bs-toggle="collapse" data-bs-target="#users-collapse"
                        th:aria-expanded="${currentURI != null && currentURI.startsWith('/users')}" aria-controls="users-collapse">
                    <span>Users</span>
                    <i class="bi bi-chevron-down"></i>
                </button>
                <div class="collapse" id="users-collapse"
                     th:classappend="${currentURI != null && currentURI.startsWith('/users') ? 'show' : ''}">
                    <ul class="nav nav-pills flex-column submenu">
                        <li>
                            <a href="/users/browse" class="nav-link"
                               th:classappend="${currentURI != null && currentURI.startsWith('/users/browse') ? 'active' : ''}">
                                Browse Users
                            </a>
                        </li>
                        <li>
                            <a href="/users/add" class="nav-link"
                               th:classappend="${currentURI != null && currentURI.startsWith('/users/add') ? 'active' : ''}">
                                Add User
                            </a>
                        </li>
                    </ul>
                </div>
            </li>
        </ul>
        <hr>
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle fs-4 me-2"></i>
                <strong sec:authentication="name">User</strong>
            </a>
            <ul class="dropdown-menu text-small shadow" aria-labelledby="dropdownUser1">
                <li><a class="dropdown-item" href="/logout">Sign out</a></li>
            </ul>
        </div>
    </div>

    <div class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">
        <div th:replace="${content}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
