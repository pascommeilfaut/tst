<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::div})}">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
<div class="w-100">
    <h1>Dashboard</h1>

    <div class="stat-card-holder mb-4">
        <div th:replace="~{::card(status='NEW', caption='New issues', color='red', icon_name='file_text_o.svg', value=${newIssuesNumber})}"></div>
        <div th:replace="~{::card(status='PENDING', caption='Pending issues', color='orange', icon_name='ellipse_circle_o.svg', value=${pendingIssuesNumber})}"></div>
        <div th:replace="~{::card(status='ASSIGNED', caption='Assigned issues', color='blue', icon_name='arrow_right.svg', value=${assignedIssuesNumber})}"></div>
        <div th:replace="~{::card(status='IN_PROGRESS', caption='In progress issues', color='green', icon_name='refresh.svg', value=${inProgressIssuesNumber})}"></div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">All Issues</h2>
        <a href="/issues/add" class="btn btn-primary">Add Issue</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th th:replace="~{::sortHeader('id', 'Issue #')}"></th>
                    <th th:replace="~{::sortHeader('pos.name', 'Pos Name')}"></th>
                    <th th:replace="~{::sortHeader('createdBy.name', 'Created By')}"></th>
                    <th th:replace="~{::sortHeader('createdAt', 'Date')}"></th>
                    <th th:replace="~{::sortHeader('type.name', 'Type')}"></th>
                    <th th:replace="~{::sortHeader('status', 'Status')}"></th>
                    <th th:replace="~{::sortHeader('assignedTo', 'Assigned To')}"></th>
                    <th th:replace="~{::sortHeader('memo', 'Memo')}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="issue : ${issues.content}">
                    <td th:text="${issue.id}"></td>
                    <td th:text="${issue.pos.name}"></td>
                    <td th:text="${issue.createdBy.name}"></td>
                    <td th:text="${issue.createdAt != null ? #temporals.format(issue.createdAt, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                    <td th:text="${issue.type.name}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${issue.status.getValue().name() == 'NEW' ? 'bg-danger' :
                                                (issue.status.getValue().name() == 'PENDING' ? 'bg-warning text-dark' :
                                                (issue.status.getValue().name() == 'ASSIGNED' ? 'bg-primary' : 'bg-success'))}"
                              th:text="${issue.status.value.displayName}">
                        </span>
                    </td>
                    <td th:text="${issue.assignedTo != null ? issue.assignedTo.value.displayName : '-'}"></td>
                    <td th:text="${issue.memo}" class="text-truncate" style="max-width: 150px;"></td>
                </tr>
                <tr th:if="${issues.empty}">
                    <td colspan="8" class="text-center py-5 text-muted">
                        <span class="fs-4">No issues found</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer bg-white py-3" th:if="${issues.totalPages > 0}">
            <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center m-0">
                    <li class="page-item" th:classappend="${issues.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/dashboard(status=${param.status}, page=${issues.number - 1}, sort=${param.sort})}">Previous</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link border-0" th:text="${'Page ' + (issues.number + 1) + ' of ' + issues.totalPages}"></span>
                    </li>
                    <li class="page-item" th:classappend="${issues.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/dashboard(status=${param.status}, page=${issues.number + 1}, sort=${param.sort})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <div style="display: none">
        <div th:fragment="card" th:classappend="${color}" class="stat-card">
            <a class="page-link" th:href="@{/issues/browse(status=${status}, page=0, sort='desc')}">
                <div class="stat-top">
                    <svg class="stat-icon">
                        <use th:href="@{${'/icons/' + icon_name}}"/>
                    </svg>
                    <span th:text="${value}" class="stat-number">0</span>
                </div>
                <span th:text="${caption}" class="stat-caption"></span>
                <div class="stat-link">
                    <span>View details</span>
                    <svg class="stat-link-icon">
                        <use th:href="@{/icons/arrow_circle_right_o.svg}"/>
                    </svg>
                </div>
            </a>
        </div>

        <table th:fragment="sortHeader(field, label)">
            <th scope="col" style="cursor: pointer; white-space: nowrap;"
                th:with="currentSort=${issues.sort.getOrderFor(field)},
                         isAsc=${currentSort?.direction?.name() == 'ASC'},
                         nextDir=${isAsc ? 'desc' : 'asc'}">

                <a th:href="@{/dashboard(status=${param.status}, page=${issues.number}, size=${issues.size}, sort=${field} + ',' + ${nextDir})}"
                   class="text-decoration-none text-dark d-flex justify-content-between align-items-center user-select-none">

                    <span th:text="${label}" class="fw-bold me-2">Label</span>

                    <span class="text-muted" style="font-size: 0.8rem;">
                        <span th:if="${isAsc}">&#9650;</span>
                        <span th:if="${currentSort != null and !isAsc}">&#9660;</span>
                        <span th:if="${currentSort == null}" class="opacity-25">&#8645;</span>
                    </span>
                </a>
            </th>
        </table>
    </div>
</div>
</body>
</html>
