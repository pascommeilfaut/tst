<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>

    <link th:href="@{/styles/main.css}" rel="stylesheet"/>

</head>
<body>
<h1>Dashboard</h1>
<div class="stat-card-holder">
    <div class="stat-card red">
        <div class="stat-top">
            <div class="stat-icon">
                <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="0 0 16 16"
                     preserveAspectRatio="xMidYMid meet">
                    <g id="svg-group">
                        <g>

                            <path d="M4 11h8v1h-8v-1z"></path>
                        </g><!--?--></g>
                    <g id="use-group" visibility="hidden">
                        <use></use>
                    </g>
                </svg>
            </div>
            <span class="stat-number">0</span>
        </div>
        <span class="stat-caption">New issues</span>
        <div class="stat-link">
            <span>View details</span>
            <div class="stat-icon">

                    </g>
                </svg>
            </div>
        </div>
    </div>
