<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th th:fragment="sortHeader(field, label, page, url)" scope="col" style="cursor: pointer; white-space: nowrap;"
    th:with="currentSort=${page.sort.getOrderFor(field)},
                 isAsc=${currentSort?.direction?.name() == 'ASC'},
                 nextDir=${isAsc ? 'desc' : 'asc'}">

    <a th:href="@{${url}(page=${page.number}, size=${page.size}, sort=${field} + ',' + ${nextDir})}"
       class="text-decoration-none text-dark d-flex justify-content-between align-items-center user-select-none">

        <span th:text="${label}" class="fw-bold me-2">Label</span>

        <span class="text-muted" style="font-size: 0.8rem;">
                <span th:if="${isAsc}">&#9650;</span>
                <span th:if="${currentSort != null and !isAsc}">&#9660;</span>
                <span th:if="${currentSort == null}" class="opacity-25">&#8645;</span>
            </span>
    </a>
</th>

<div th:fragment="pagination(page, url)" class="card-footer bg-white py-3" th:if="${page.totalPages > 0}">
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center m-0">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{${url}(page=${page.number - 1}, sort=${param.sort})}">Previous</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link border-0" th:text="${'Page ' + (page.number + 1) + ' of ' + page.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{${url}(page=${page.number + 1}, sort=${param.sort})}">Next</a>
            </li>
        </ul>
    </nav>
</div>

</body>
</html>
