<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="searchForm(url)" class="mb-3">
    <form th:action="@{${url}}" method="get" class="d-flex" style="max-width: 400px;">
        <input type="text" name="searchTerm" class="form-control me-2"
               placeholder="Search..." th:value="${param.searchTerm}" aria-label="Search">
        <button class="btn btn-outline-success" type="submit">Search</button>
        <a th:if="${not #strings.isEmpty(param.searchTerm)}" th:href="@{${url}}" class="btn btn-outline-secondary ms-2">Clear</a>
    </form>
</div>

<th th:fragment="sortHeader(field, label, page, url)" scope="col" style="cursor: pointer; white-space: nowrap;"
    th:with="currentSort=${page.sort.getOrderFor(field)},
                 isAsc=${currentSort?.direction?.name() == 'ASC'},
                 nextDir=${isAsc ? 'desc' : 'asc'}">

    <a th:href="@{${url}(page=${page.number}, size=${page.size}, sort=${field} + ',' + ${nextDir}, status=${param.status}, searchTerm=${param.searchTerm})}"
       class="text-decoration-none text-dark d-flex justify-content-between align-items-center user-select-none">

        <span th:text="${label}" class="fw-bold me-2">Label</span>

        <span class="text-muted" style="font-size: 0.8rem;">
                <span th:if="${isAsc}">&#9650;</span>
                <span th:if="${currentSort != null and !isAsc}">&#9660;</span>
                <span th:if="${currentSort == null}" class="opacity-25">&#8645;</span>
            </span>
    </a>
</th>

<div th:fragment="pagination(page, url)" class="card-footer bg-light py-2" th:if="${page.totalElements > 0}">
    <div class="d-flex justify-content-between align-items-center">

        <div class="d-flex align-items-center gap-3">
            <small class="text-muted text-nowrap">
                Page <span class="fw-bold" th:text="${page.number + 1}">1</span> of <span class="fw-bold" th:text="${page.totalPages}">10</span>
            </small>

            <form th:action="@{${url}}" method="get" class="d-flex align-items-center">
                <input type="hidden" name="sort" th:value="${param.sort}" />
                <input type="hidden" name="searchTerm" th:value="${param.searchTerm}" />
                <input type="hidden" name="status" th:value="${param.status}" />
                <input type="hidden" name="page" value="0" />

                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-transparent border-0 pe-1 text-muted">Rows:</span>
                    <select name="size" onchange="this.form.submit()" class="form-select form-select-sm" style="max-width: 70px; cursor: pointer;">
                        <option th:value="10" th:selected="${page.size == 10}">10</option>
                        <option th:value="20" th:selected="${page.size == 20}">20</option>
                        <option th:value="50" th:selected="${page.size == 50}">50</option>
                        <option th:value="100" th:selected="${page.size == 100}">100</option>
                    </select>
                </div>
            </form>
        </div>

        <nav aria-label="Page navigation">
            <ul class="pagination pagination-sm m-0">
                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link" th:href="@{${url}(page=${page.number - 1}, size=${page.size}, sort=${param.sort}, status=${param.status}, searchTerm=${param.searchTerm})}" aria-label="Previous">
                        <span aria-hidden="true">&laquo; Prev</span>
                    </a>
                </li>

                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link" th:href="@{${url}(page=${page.number + 1}, size=${page.size}, sort=${param.sort}, status=${param.status}, searchTerm=${param.searchTerm})}" aria-label="Next">
                        <span aria-hidden="true">Next &raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<div th:fragment="issuesList(issues, url)">
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th th:replace="~{fragments/tables :: sortHeader('id', 'Issue #', ${issues}, ${url})}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('pos.name', 'Pos Name', ${issues}, ${url})}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('createdBy.name', 'Created By', ${issues}, ${url})}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('createdAt', 'Date', ${issues}, ${url})}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('type.name', 'Type', ${issues}, ${url})}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('status', 'Status', ${issues}, ${url})}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('assignedTo', 'Assigned To', ${issues}, ${url})}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('memo', 'Memo', ${issues}, ${url})}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="issue : ${issues.content}">
                    <td th:text="${issue.id}"></td>
                    <td th:text="${issue.pos.name}"></td>
                    <td th:text="${issue.createdBy.name}"></td>
                    <td th:text="${issue.createdAt != null ? #temporals.format(issue.createdAt, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                    <td th:text="${issue.type.name}"></td>
                    <td>
                            <span class="badge"
                                  th:classappend="${issue.status.getValue().name() == 'NEW' ? 'bg-danger' :
                                                    (issue.status.getValue().name() == 'PENDING' ? 'bg-warning text-dark' :
                                                    (issue.status.getValue().name() == 'ASSIGNED' ? 'bg-primary' : 'bg-success'))}"
                                  th:text="${issue.status.value.displayName}">
                            </span>
                    </td>
                    <td th:text="${issue.assignedTo != null ? issue.assignedTo.value.displayName : '-'}"></td>
                    <td th:text="${issue.memo}" class="text-truncate" style="max-width: 150px;"></td>
                </tr>
                <tr th:if="${issues.empty}">
                    <td colspan="8" class="text-center py-5 text-muted">
                        <span class="fs-4">No issues found</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/tables :: pagination(${issues}, ${url})}"></div>
    </div>
</div>

</body>
</html>
