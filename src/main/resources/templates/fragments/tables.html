<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th th:fragment="sortHeader(field, label, page, url)" scope="col" style="cursor: pointer; white-space: nowrap;"
    th:with="currentSort=${page.sort.getOrderFor(field)},
             isAsc=${currentSort?.direction?.name() == 'ASC'},
             nextDir=${isAsc ? 'desc' : 'asc'}">

    <a th:href="@{${url}(page=${page.number}, size=${page.size}, sort=${field} + ',' + ${nextDir}, status=${param.status})}"
       class="text-decoration-none text-dark d-flex justify-content-between align-items-center user-select-none">
        <span th:text="${label}" class="fw-bold me-2">Label</span>
        <span class="text-muted" style="font-size: 0.8rem;">
            <span th:if="${isAsc}">&#9650;</span>
            <span th:if="${currentSort != null and !isAsc}">&#9660;</span>
            <span th:if="${currentSort == null}" class="opacity-25">&#8645;</span>
        </span>
    </a>
</th>

<div th:fragment="pagination(page, url)" class="card-footer bg-white py-3" th:if="${page.totalPages > 0}">
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center m-0">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{${url}(page=${page.number - 1}, sort=${param.sort}, status=${param.status})}">Previous</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link border-0" th:text="${'Page ' + (page.number + 1) + ' of ' + page.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{${url}(page=${page.number + 1}, sort=${param.sort}, status=${param.status})}">Next</a>
            </li>
        </ul>
    </nav>
</div>

<div th:fragment="issuesList(issues, url)">
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th th:replace="~{fragments/tables :: sortHeader('id', 'Issue #', ${issues}, ${url})}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('pos.name', 'Pos Name', ${issues}, ${url})}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('createdBy.name', 'Created By', ${issues}, ${url})}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('createdAt', 'Date', ${issues}, ${url})}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('type.name', 'Type', ${issues}, ${url})}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('status', 'Status', ${issues}, ${url})}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('assignedTo', 'Assigned To', ${issues}, ${url})}"></th>
                    <th th:replace="~{fragments/tables :: sortHeader('memo', 'Memo', ${issues}, ${url})}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="issue : ${issues.content}">
                    <td th:text="${issue.id}"></td>
                    <td th:text="${issue.pos.name}"></td>
                    <td th:text="${issue.createdBy.name}"></td>
                    <td th:text="${issue.createdAt != null ? #temporals.format(issue.createdAt, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                    <td th:text="${issue.type.name}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${issue.status.getValue().name() == 'NEW' ? 'bg-danger' :
                                                (issue.status.getValue().name() == 'PENDING' ? 'bg-warning text-dark' :
                                                (issue.status.getValue().name() == 'ASSIGNED' ? 'bg-primary' : 'bg-success'))}"
                              th:text="${issue.status.value.displayName}">
                        </span>
                    </td>
                    <td th:text="${issue.assignedTo != null ? issue.assignedTo.value.displayName : '-'}"></td>
                    <td th:text="${issue.memo}" class="text-truncate" style="max-width: 150px;"></td>
                </tr>
                <tr th:if="${issues.empty}">
                    <td colspan="8" class="text-center py-5 text-muted">
                        <span class="fs-4">No issues found</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/tables :: pagination(${issues}, ${url})}"></div>
    </div>
</div>

</body>
</html>
